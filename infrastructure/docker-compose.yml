services:
  preopai-postgres:
    image: postgres:16
    container_name: preopai-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: preopai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d preopai"]
      interval: 10s
      timeout: 5s
      retries: 5
  
